# Psicoman — borda pública do PORTAL do paciente.
#
# Este nginx é a ÚNICA superfície exposta à internet. Ele encaminha SOMENTE o
# portal do paciente (/v1/portal/*) e as sondas de saúde; TUDO o mais (terapeuta
# /v1/app, operação /v1/admin, REST nativa /api/, admin UI /_/, swagger) é
# NEGADO aqui — essas superfícies ficam atrás do Pangolin, nunca na internet.
#
# Terminação de TLS: NÃO é feita aqui. No compose local o nginx fala HTTP; em
# produção quem termina TLS é a camada acima (Pangolin/LB). Por isso o nginx só
# aplica endurecimento L7 (rate limit, limite de corpo, timeouts).

# Rate limit por IP para as rotas públicas do portal. zone de 10MB ~ 160k IPs.
limit_req_zone $binary_remote_addr zone=portal:10m rate=30r/m;
# Limite de conexões simultâneas por IP (mitiga slowloris/abuso).
limit_conn_zone $binary_remote_addr zone=portalconn:10m;

# Upstream: o binário psicoman na rede interna do compose (não exposto ao host).
upstream psicoman_backend {
    server psicoman:8090;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    # Endurecimento geral.
    client_max_body_size 2m;            # corpo pequeno (cadastro/pedido); o app também limita
    client_body_timeout 10s;            # corta uploads lentos (slowloris)
    client_header_timeout 10s;
    send_timeout 15s;
    limit_conn portalconn 20;
    server_tokens off;                  # não vazar versão do nginx

    # Cabeçalhos de segurança básicos para as respostas do portal.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Sondas de saúde (liveness/readiness/health) — úteis para o LB de borda.
    location = /v1/livez  { proxy_pass http://psicoman_backend; }
    location = /v1/readyz { proxy_pass http://psicoman_backend; }
    location = /v1/health { proxy_pass http://psicoman_backend; }

    # PORTAL do paciente: única superfície de negócio exposta.
    location /v1/portal/ {
        limit_req zone=portal burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://psicoman_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # NUNCA repassar um header de identidade do Pangolin vindo da internet:
        # o portal não usa identidade de borda, e limpá-lo evita spoofing para
        # as rotas de terapeuta caso alguma config as exponha por engano.
        proxy_set_header X-Pangolin-User "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # NEGA tudo o que não é portal/saúde — defesa explícita, não por omissão.
    # /v1/app e /v1/admin (terapeuta/operação), /api (REST nativa), /_ (admin UI),
    # /v1/swagger (documentação) ficam SÓ atrás do Pangolin.
    location / {
        return 404;
    }
}
