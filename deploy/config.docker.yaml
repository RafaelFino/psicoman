# Psicoman — config de exemplo para a STACK LOCAL em Docker (binário único).
#
# O docker-compose.yml provê a chave de cifra por ENV (PSICOMAN_CIPHER_*), que
# é o mínimo para o boot (fail-closed). Este arquivo é OPCIONAL: monte-o em
# /app/config.yaml e aponte com --config se quiser ligar Google/Gemini no teste
# local. NUNCA versione segredos reais.
#
# Formato idêntico ao config.example.yaml (arquitetura pocketbase-core).

log:
  level: "info"

# Cifra por campo (AES-256-GCM). Em dev, a mesma chave fixa do compose. Em
# produção, gere com: openssl rand -base64 32 (e NUNCA versione).
crypto:
  key_id: "k1"
  keys:
    k1: "wPb6Yex4abAI5VpFY6SIonnjtPOmtuGP2MJVnezqUKY="

# Identidade injetada pelo Pangolin (default X-Pangolin-User). Sem Pangolin no
# teste local, as rotas /v1/app e /v1/admin exigem o header manualmente.
pangolin:
  identity_header: "X-Pangolin-User"

# Google e Gemini ficam VAZIOS por padrão: Calendar/Drive degradam (no-op) e a
# IA fica desligada (opt-in pela presença da api_key). Preencha para testar.
google:
  client_id: ""
  client_secret: ""
  calendar_id: ""
  drive_folder: "" # opcional (R3): vazio = pasta "Psicoman DR" criada automaticamente
  drive_retention: 14 # snapshots mantidos no Drive (excedentes vão à lixeira); 0 = manual

# Métricas Prometheus (R8): listener DEDICADO, separado da API. Sem metrics.addr
# ele NÃO sobe. Dentro do container use 0.0.0.0:9091 (a porta NÃO é publicada no
# host; só a rede interna do coletor a alcança). Equivale a PSICOMAN_METRICS_ADDR.
# metrics:
#   addr: "0.0.0.0:9091"

llm:
  gemini:
    api_key: ""
