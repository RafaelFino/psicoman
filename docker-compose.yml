# Psicoman — stack LOCAL de teste (binário único) para navegabilidade.
#
# Um único serviço (o binário único com o PocketBase embarcado). Em produção o
# Psicoman roda SEMPRE atrás do Pangolin; aqui a porta é publicada direto no
# host só para teste local. NÃO use isto em produção.
#
# A chave de cifra é FIXA de teste (fail-closed: sem ela o boot aborta). NUNCA
# reutilize esta chave fora do ambiente local.
#
# Suba com:   docker compose up --build
# Pare/limpe: docker compose down -v   (remove o volume de dados)

name: psicoman-local

services:
  psicoman:
    build:
      context: .
      dockerfile: Dockerfile
    image: psicoman-local:dev
    command: ["serve", "--http", "0.0.0.0:8090", "--dir", "/data"]
    ports:
      - "8090:8090"
    environment:
      # Chave de cifra de TESTE (base64 de 32 bytes). Só para o ambiente local.
      PSICOMAN_CIPHER_KEY_ID: "k1"
      PSICOMAN_CIPHER_KEYS: "k1:wPb6Yex4abAI5VpFY6SIonnjtPOmtuGP2MJVnezqUKY="
    volumes:
      - psicoman-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://0.0.0.0:8090/v1/livez"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

volumes:
  psicoman-data:
    name: psicoman-local-data
