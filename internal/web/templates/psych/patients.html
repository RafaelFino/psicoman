{{define "title"}}Pacientes — Psicoman{{end}}
{{define "page-title"}}Pacientes{{end}}

{{define "content"}}
<div class="section" x-data="{ showForm: false }">
  <div class="section-header">
    <h2>{{len .Patients}} pacientes</h2>
    <button class="btn btn-primary btn-sm" @click="showForm = !showForm">+ Novo paciente</button>
  </div>

  <!-- Form novo paciente -->
  <div class="card mb-2" x-show="showForm" x-cloak>
    <form hx-post="/api/psych/patients" hx-target="#patient-list" hx-swap="innerHTML" hx-on::after-request="this.reset()">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Nome <span class="required">*</span></label>
          <input name="name" class="form-input" required placeholder="Nome completo">
        </div>
        <div class="form-group">
          <label class="form-label">Email <span class="required">*</span></label>
          <input name="email" type="email" class="form-input" required placeholder="email@exemplo.com">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Telefone</label>
        <input name="phone" class="form-input" placeholder="(11) 99999-9999">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Cadastrar</button>
        <button type="button" class="btn btn-secondary" @click="showForm = false">Cancelar</button>
      </div>
    </form>
  </div>

  <!-- Lista -->
  <div class="card">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>Telefone</th>
            <th>Desde</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="patient-list">
          {{range .Patients}}
          <tr>
            <td><a href="/psych/patients/{{.ID}}"><strong>{{.Name}}</strong></a></td>
            <td class="text-muted">{{.Email}}</td>
            <td>{{.Phone}}</td>
            <td class="text-sm text-muted">{{formatDate .CreatedAt}}</td>
            <td><a href="/psych/patients/{{.ID}}" class="btn btn-ghost btn-sm">Ver</a></td>
          </tr>
          {{else}}
          <tr><td colspan="5" class="text-muted" style="text-align:center">Nenhum paciente cadastrado.</td></tr>
          {{end}}
        </tbody>
      </table>
    </div>
  </div>
</div>
{{end}}
