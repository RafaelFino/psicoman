<div id="calendar-container"
     hx-get="/psych/patients/{{.PatientID}}/calendar{{.NextMonth}}"
     hx-swap="outerHTML"
     hx-trigger="calendarRefresh from:body">
    <div class="calendar-header">
        <button
            hx-get="/psych/patients/{{.PatientID}}/calendar{{.PrevMonth}}"
            hx-target="#calendar-container"
            hx-swap="outerHTML"
            hx-indicator="#calendar-loading"
            class="btn btn-ghost btn-sm"
            aria-label="Mês anterior">← Anterior</button>
        <h3>{{.MonthName}}</h3>
        <button
            hx-get="/psych/patients/{{.PatientID}}/calendar{{.NextMonth}}"
            hx-target="#calendar-container"
            hx-swap="outerHTML"
            hx-indicator="#calendar-loading"
            class="btn btn-ghost btn-sm"
            aria-label="Próximo mês">Próximo →</button>
    </div>
    <div id="calendar-loading" class="htmx-indicator" style="text-align:center;padding:0.5rem;color:var(--text-muted)">Carregando...</div>
    <div class="calendar-grid">
        <div class="calendar-weekday">Dom</div>
        <div class="calendar-weekday">Seg</div>
        <div class="calendar-weekday">Ter</div>
        <div class="calendar-weekday">Qua</div>
        <div class="calendar-weekday">Qui</div>
        <div class="calendar-weekday">Sex</div>
        <div class="calendar-weekday">Sáb</div>
        {{range .Days}}
        {{if eq .Day 0}}
        <div class="calendar-day empty"></div>
        {{else}}
        <div class="calendar-day{{if .IsToday}} today{{end}}"
             {{if not .Appointments}}@click="selectedDate='{{.Date}}'; modal='create'"{{end}}>
            <span class="calendar-day-number">{{.Day}}</span>
            {{range .Appointments}}
            <a class="calendar-appt {{.Status}}" href="#"
               @click.stop.prevent="selectedAppointment='{{.ID}}'; modal='edit'"
               title="{{.PatientName}} — {{formatTime .ScheduledAt}} ({{.DurationMinutes}}min)">
                <span class="calendar-appt-time">{{formatTime .ScheduledAt}}</span>
                <span class="calendar-appt-type">{{if eq .Type "online"}}🖥{{else}}🏠{{end}}</span>
            </a>
            {{end}}
        </div>
        {{end}}
        {{end}}
    </div>
</div>
