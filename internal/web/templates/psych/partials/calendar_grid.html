<div id="calendar-container"
     hx-get="/psych/patients/{{.PatientID}}/calendar{{.NextMonth}}"
     hx-swap="outerHTML"
     hx-trigger="calendarRefresh from:body">
    <div class="calendar-header">
        <button
            hx-get="/psych/patients/{{.PatientID}}/calendar{{.PrevMonth}}"
            hx-target="#calendar-container"
            hx-swap="outerHTML"
            hx-indicator="#calendar-loading"
            class="btn-icon"
            aria-label="Mês anterior">&larr;</button>
        <h3>{{.MonthName}}</h3>
        <button
            hx-get="/psych/patients/{{.PatientID}}/calendar{{.NextMonth}}"
            hx-target="#calendar-container"
            hx-swap="outerHTML"
            hx-indicator="#calendar-loading"
            class="btn-icon"
            aria-label="Próximo mês">&rarr;</button>
    </div>
    <div id="calendar-loading" class="htmx-indicator">Carregando...</div>
    <div class="calendar-grid">
        <div class="calendar-weekday">Dom</div>
        <div class="calendar-weekday">Seg</div>
        <div class="calendar-weekday">Ter</div>
        <div class="calendar-weekday">Qua</div>
        <div class="calendar-weekday">Qui</div>
        <div class="calendar-weekday">Sex</div>
        <div class="calendar-weekday">Sáb</div>
        {{range .Days}}
        {{if eq .Day 0}}
        <div class="calendar-day calendar-day-empty"></div>
        {{else}}
        <div class="calendar-day{{if .IsToday}} calendar-today{{end}}"
             {{if not .Appointments}}@click="selectedDate='{{.Date}}'; modal='create'"{{end}}>
            <span class="calendar-day-number">{{.Day}}</span>
            {{range .Appointments}}
            <span class="calendar-dot"
                  @click.stop="selectedAppointment={{.ID}}; modal='edit'"
                  title="{{formatTime .ScheduledAt}}"></span>
            {{end}}
        </div>
        {{end}}
        {{end}}
    </div>
</div>
