{{define "title"}}Configurações — Psicoman{{end}}
{{define "page-title"}}Configurações{{end}}

{{define "content"}}
<div class="section" x-data="{
  rules: null, loading: true, saved: false,
  headers: {'Content-Type':'application/json','X-Dev-Auth':'dev-local'},
  init() { fetch('/api/psych/scheduling-rules',{headers:this.headers}).then(r=>r.json()).then(d=>{this.rules=d;this.loading=false}) },
  save() {
    fetch('/api/psych/scheduling-rules',{method:'PUT',headers:this.headers,body:JSON.stringify(this.rules)})
      .then(()=>{this.saved=true;setTimeout(()=>this.saved=false,2000)})
  }
}" x-init="init()">
  <p x-show="saved" style="color:var(--success)">Salvo!</p>

  <div class="card mb-2" x-show="rules">
    <h3>Regras de agendamento</h3>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Horas mínimas para cancelar</label>
        <input type="number" x-model.number="rules.min_hours_to_cancel" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Horas mínimas para reagendar</label>
        <input type="number" x-model.number="rules.min_hours_to_reschedule" class="form-input">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Máximo reagendamentos/mês</label>
      <input type="number" x-model.number="rules.max_reschedules_per_month" class="form-input" style="max-width:200px">
    </div>
    <label class="form-checkbox"><input type="checkbox" x-model="rules.allow_patient_cancel"> Paciente pode cancelar</label>
    <label class="form-checkbox mt-1"><input type="checkbox" x-model="rules.allow_patient_reschedule"> Paciente pode reagendar</label>
    <div class="form-actions">
      <button class="btn btn-primary" @click="save()">Salvar regras</button>
    </div>
  </div>

  <div class="card">
    <h3>Google Calendar</h3>
    <p class="text-muted">Conecte sua conta Google para sincronizar agenda e criar links do Meet.</p>
    <button class="btn btn-secondary" @click="
      fetch('/api/psych/google/auth',{headers:{'X-Dev-Auth':'dev-local'}}).then(r=>r.json()).then(d=>{if(d.url)window.location.href=d.url;else alert(d.error||'Google não configurado')})
    ">Conectar Google Calendar</button>
  </div>
</div>
{{end}}
