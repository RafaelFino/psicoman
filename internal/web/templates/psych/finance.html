{{define "title"}}Financeiro — Psicoman{{end}}
{{define "page-title"}}Financeiro{{end}}

{{define "content"}}
<div class="section" x-data="{
  summary: null, reports: [], loading: true,
  headers: {'X-Dev-Auth':'dev-local'},
  month: new Date().getMonth()+1, year: new Date().getFullYear(),
  formatBRL(cents) { return (cents/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}) },
  load() {
    this.loading=true;
    Promise.all([
      fetch('/api/psych/finance/summary?month='+this.month+'&year='+this.year,{headers:this.headers}).then(r=>r.json()),
      fetch('/api/psych/finance/reports/monthly?month='+this.month+'&year='+this.year,{headers:this.headers}).then(r=>r.json()),
    ]).then(([s,r])=>{this.summary=s;this.reports=r||[];this.loading=false})
  }
}" x-init="load()">
  <div x-show="summary" class="grid grid-4 mb-2">
    <div class="stat-card">
      <div class="label">Recebido</div>
      <div class="value" x-text="summary?formatBRL(summary.total_received):''"></div>
    </div>
    <div class="stat-card">
      <div class="label">A receber</div>
      <div class="value" x-text="summary?formatBRL(summary.total_pending):''"></div>
    </div>
    <div class="stat-card">
      <div class="label">Custos</div>
      <div class="value" x-text="summary?formatBRL(summary.total_costs):''"></div>
    </div>
    <div class="stat-card">
      <div class="label">Saldo</div>
      <div class="value" x-text="summary?formatBRL(summary.balance):''"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h3>Relatório mensal por paciente</h3>
    </div>
    <div class="table-container">
      <table>
        <thead><tr><th>Paciente</th><th>Consultas</th><th>Valor total</th></tr></thead>
        <tbody>
          <template x-for="r in reports" :key="r.patient_id">
            <tr>
              <td><a :href="'/psych/patients/'+r.patient_id" x-text="r.patient_name"></a></td>
              <td x-text="(r.appointments||[]).length"></td>
              <td x-text="formatBRL(r.total_amount)"></td>
            </tr>
          </template>
          <tr x-show="!loading&&reports.length===0"><td colspan="3" class="text-muted">Sem dados para o período.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
{{end}}
