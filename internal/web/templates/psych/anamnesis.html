{{define "title"}}Anamnese — Psicoman{{end}}
{{define "page-title"}}Anamnese{{end}}

{{define "content"}}
<div class="section" x-data="{ tab: 'templates' }">
  <div class="tabs">
    <button class="tab" :class="tab==='templates'&&'active'" @click="tab='templates'">Templates</button>
    <button class="tab" :class="tab==='responses'&&'active'" @click="tab='responses'">Respostas</button>
  </div>

  <div x-show="tab==='templates'" x-data="{
    templates: [], loading: true, headers: {'Content-Type':'application/json','X-Dev-Auth':'dev-local'},
    init() { fetch('/api/psych/anamnesis/templates',{headers:this.headers}).then(r=>r.json()).then(d=>{this.templates=d||[];this.loading=false}) }
  }" x-init="init()">
    <div class="card">
      <div class="card-header"><h3>Templates de anamnese</h3></div>
      <div class="table-container">
        <table>
          <thead><tr><th>Nome</th><th>Faixa etária</th><th>Campos</th><th>Status</th></tr></thead>
          <tbody>
            <template x-for="t in templates" :key="t.id">
              <tr>
                <td x-text="t.name" class="font-medium"></td>
                <td><span class="badge" x-text="t.target_age_group==='adult'?'Adulto':t.target_age_group==='child'?'Criança':'Universal'"></span></td>
                <td x-text="(t.fields||[]).length+' campos'"></td>
                <td><span class="badge" :class="t.is_active?'badge-completed':'badge-cancelled'" x-text="t.is_active?'Ativo':'Inativo'"></span></td>
              </tr>
            </template>
            <tr x-show="!loading && templates.length===0"><td colspan="4" class="text-muted">Nenhum template criado.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div x-show="tab==='responses'" x-data="{
    responses: [], loading: true, headers: {'X-Dev-Auth':'dev-local'},
    init() { fetch('/api/psych/anamnesis/responses',{headers:this.headers}).then(r=>r.json()).then(d=>{this.responses=d||[];this.loading=false}) }
  }" x-init="init()">
    <div class="card">
      <div class="card-header"><h3>Respostas de pacientes</h3></div>
      <div class="table-container">
        <table>
          <thead><tr><th>Paciente</th><th>Template</th><th>Data</th></tr></thead>
          <tbody>
            <template x-for="r in responses" :key="r.id">
              <tr>
                <td><a :href="'/psych/patients/'+r.patient_id" x-text="r.patient_name"></a></td>
                <td x-text="r.template_name"></td>
                <td class="text-sm" x-text="r.completed_at ? new Date(r.completed_at).toLocaleDateString('pt-BR') : '—'"></td>
              </tr>
            </template>
            <tr x-show="!loading && responses.length===0"><td colspan="3" class="text-muted">Nenhuma resposta recebida.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{{end}}
