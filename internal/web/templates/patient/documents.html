{{define "title"}}Documentos — Psicoman{{end}}

{{define "content"}}
<h2 class="page-title">Meus documentos</h2>

<div x-data="{
  docs: [], loading: true,
  token() { return document.cookie.split(';').find(c=>c.trim().startsWith('patient_token='))?.split('=')[1] || '' },
  headers() { return {'Authorization':'Bearer '+this.token()} },
  load() {
    fetch('/api/patient/documents',{headers:this.headers()}).then(r=>r.json()).then(d=>{this.docs=d||[];this.loading=false})
  },
  download(id, filename) {
    fetch('/api/patient/documents/'+id+'/download',{headers:this.headers()})
      .then(r=>r.blob()).then(b=>{
        const url=URL.createObjectURL(b);
        const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
      })
  }
}" x-init="load()">
  <div x-show="!loading && docs.length===0" class="empty-state">
    <div class="icon">📁</div>
    <p>Nenhum documento disponível.</p>
  </div>

  <div class="card" x-show="docs.length > 0">
    <table>
      <thead><tr><th>Arquivo</th><th>Tipo</th><th>Data</th><th></th></tr></thead>
      <tbody>
        <template x-for="d in docs" :key="d.id">
          <tr>
            <td x-text="d.filename" class="font-medium"></td>
            <td><span class="badge" x-text="d.doc_type"></span></td>
            <td class="text-sm" x-text="new Date(d.created_at).toLocaleDateString('pt-BR')"></td>
            <td><button class="btn btn-ghost btn-sm" @click="download(d.id, d.filename)">Baixar</button></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
{{end}}
