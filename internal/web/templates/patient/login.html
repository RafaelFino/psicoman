{{define "title"}}Login — Psicoman{{end}}

{{define "body"}}
<div class="layout-patient" style="min-height:100vh; display:flex; align-items:center; justify-content:center">
  <div class="card" style="width:100%; max-width:420px; margin:1rem" x-data="{ tab: 'login', loading: false, error: '' }">
    <h2 style="text-align:center; margin-bottom:1rem">Area do Paciente</h2>

    <div class="tabs" style="justify-content:center">
      <button class="tab" :class="tab === 'login' && 'active'" @click="tab = 'login'">Entrar</button>
      {{if .DevMode}}
      <button class="tab" :class="tab === 'dev' && 'active'" @click="tab = 'dev'">Dev</button>
      {{end}}
    </div>

    <p x-show="error" class="form-error" x-text="error" style="text-align:center"></p>

    <!-- Google Login -->
    <div x-show="tab === 'login'" style="text-align:center; padding:2rem 0">
      <p class="text-muted">Entre com sua conta Google para acessar seus atendimentos.</p>
      <button class="btn btn-primary btn-lg" @click="
        fetch('/api/auth/patient/url').then(r => r.json()).then(d => {
          if(d.url) window.location.href = d.url;
          else error = 'Google não configurado';
        }).catch(e => error = e.message)
      " :disabled="loading">
        Entrar com Google
      </button>
    </div>

    {{if .DevMode}}
    <!-- Dev Login (no Google) -->
    <div x-show="tab === 'dev'" style="padding:1rem 0">
      <div style="background:var(--warning-light); border:1px solid #fde68a; border-radius:var(--radius-sm); padding:0.75rem; margin-bottom:1rem; font-size:0.85rem">
        <strong>Modo desenvolvimento</strong> — login sem Google OAuth.
      </div>
      <form @submit.prevent="
        loading = true; error = '';
        fetch('/api/dev/create-patient', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-Dev-Auth': 'dev-local'},
          body: JSON.stringify({name: $refs.devName.value, email: $refs.devEmail.value})
        }).then(r => r.json()).then(d => {
          if(d.error) { error = d.error; loading = false; return; }
          document.cookie = 'patient_token=' + d.token + '; path=/';
          window.location.href = '/patient';
        }).catch(e => { error = e.message; loading = false; })
      ">
        <div class="form-group">
          <label class="form-label">Nome</label>
          <input x-ref="devName" class="form-input" required placeholder="Paciente Teste" value="Paciente Teste">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input x-ref="devEmail" type="email" class="form-input" required placeholder="paciente@teste.local" value="paciente@teste.local">
        </div>
        <button type="submit" class="btn btn-primary" :disabled="loading" style="width:100%">
          <span x-show="!loading">Entrar sem Google</span>
          <span x-show="loading">Entrando...</span>
        </button>
      </form>
    </div>
    {{end}}
  </div>
</div>
{{end}}
