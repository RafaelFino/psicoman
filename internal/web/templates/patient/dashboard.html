{{define "title"}}Meus atendimentos — Psicoman{{end}}

{{define "content"}}
<h2 class="page-title">Meus atendimentos</h2>

<div x-data="{
  appts: [], loading: true, error: '',
  token() { return document.cookie.split(';').find(c=>c.trim().startsWith('patient_token='))?.split('=')[1] || '' },
  headers() { return {'Authorization':'Bearer '+this.token(),'Content-Type':'application/json'} },
  load() {
    fetch('/api/patient/appointments',{headers:this.headers()})
      .then(r=>r.json()).then(d=>{this.appts=d||[];this.loading=false})
      .catch(e=>{this.error=e.message;this.loading=false})
  },
  cancel(id) {
    if(!confirm('Deseja cancelar este atendimento?')) return;
    fetch('/api/patient/appointments/'+id+'/cancel',{method:'PATCH',headers:this.headers(),body:JSON.stringify({reason:'Cancelado pelo paciente'})})
      .then(()=>this.load())
  }
}" x-init="load()">
  <p x-show="error" class="form-error" x-text="error"></p>

  <div x-show="!loading && appts.length===0" class="empty-state">
    <div class="icon">📅</div>
    <p>Nenhum atendimento agendado.</p>
    <a href="/patient/book" class="btn btn-primary mt-2">Agendar consulta</a>
  </div>

  <div class="grid">
    <template x-for="a in appts" :key="a.id">
      <div class="card">
        <div class="flex-between">
          <strong x-text="new Date(a.scheduled_at).toLocaleString('pt-BR')"></strong>
          <span class="badge" :class="'badge-'+a.status" x-text="a.status"></span>
        </div>
        <p class="text-sm text-muted" x-text="a.type==='online'?'Online':'Presencial'"></p>
        <div x-show="a.meet_link" class="mt-1">
          <a :href="a.meet_link" target="_blank" class="btn btn-primary btn-sm">Entrar no Google Meet</a>
        </div>
        <div x-show="a.status==='scheduled'" class="mt-1">
          <button class="btn btn-danger btn-sm" @click="cancel(a.id)">Cancelar</button>
        </div>
      </div>
    </template>
  </div>
</div>
{{end}}
